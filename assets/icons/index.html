<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>生成 TabBar 图标</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 40px;
      background: #f5f5f5;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 40px;
      border-radius: 8px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }
    .icon-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin: 20px 0;
    }
    .icon-item {
      text-align: center;
    }
    .icon-item canvas {
      border: 1px solid #eee;
      border-radius: 8px;
    }
    .icon-item p {
      margin-top: 8px;
      font-size: 12px;
      color: #666;
    }
    button {
      background: #000;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #333;
    }
    .download-all {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>TabBar 图标生成器</h1>
    <p>点击按钮下载所有图标，然后放到 <code>assets/icons</code> 目录</p>
    
    <div class="icon-grid">
      <div class="icon-item">
        <canvas id="bill" width="81" height="81"></canvas>
        <p>账单</p>
      </div>
      <div class="icon-item">
        <canvas id="stats" width="81" height="81"></canvas>
        <p>统计</p>
      </div>
      <div class="icon-item">
        <canvas id="family" width="81" height="81"></canvas>
        <p>家庭</p>
      </div>
      <div class="icon-item">
        <canvas id="profile" width="81" height="81"></canvas>
        <p>我的</p>
      </div>
    </div>
    
    <div class="download-all">
      <button onclick="downloadAll()">下载所有图标</button>
    </div>
  </div>

  <script>
    const icons = {
      bill: {
        draw: (ctx, color) => {
          ctx.strokeStyle = color;
          ctx.lineWidth = 3;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          
          // 文档/账单图标
          const x = 20, y = 12, w = 41, h = 57;
          ctx.beginPath();
          ctx.moveTo(x + 10, y);
          ctx.lineTo(x + w, y);
          ctx.lineTo(x + w, y + h);
          ctx.lineTo(x, y + h);
          ctx.lineTo(x, y + 10);
          ctx.closePath();
          ctx.stroke();
          
          // 折角
          ctx.beginPath();
          ctx.moveTo(x + w - 10, y);
          ctx.lineTo(x + w - 10, y + 10);
          ctx.lineTo(x + w, y + 10);
          ctx.stroke();
          
          // 线条
          ctx.beginPath();
          ctx.moveTo(x + 10, y + 22);
          ctx.lineTo(x + w - 10, y + 22);
          ctx.moveTo(x + 10, y + 32);
          ctx.lineTo(x + w - 10, y + 32);
          ctx.moveTo(x + 10, y + 42);
          ctx.lineTo(x + w - 20, y + 42);
          ctx.stroke();
        }
      },
      stats: {
        draw: (ctx, color) => {
          ctx.strokeStyle = color;
          ctx.fillStyle = color;
          ctx.lineWidth = 3;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          
          // 柱状图
          const baseY = 65;
          
          // X轴
          ctx.beginPath();
          ctx.moveTo(15, baseY);
          ctx.lineTo(66, baseY);
          ctx.stroke();
          
          // 柱子
          ctx.fillRect(22, 35, 10, baseY - 35);
          ctx.fillRect(36, 20, 10, baseY - 20);
          ctx.fillRect(50, 40, 10, baseY - 40);
        }
      },
      family: {
        draw: (ctx, color) => {
          ctx.strokeStyle = color;
          ctx.lineWidth = 3;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          
          // 房子图标
          ctx.beginPath();
          ctx.moveTo(40, 15);
          ctx.lineTo(15, 38);
          ctx.lineTo(22, 38);
          ctx.lineTo(22, 62);
          ctx.lineTo(58, 62);
          ctx.lineTo(58, 38);
          ctx.lineTo(65, 38);
          ctx.closePath();
          ctx.stroke();
          
          // 门
          ctx.beginPath();
          ctx.rect(33, 45, 15, 17);
          ctx.stroke();
        }
      },
      profile: {
        draw: (ctx, color) => {
          ctx.strokeStyle = color;
          ctx.lineWidth = 3;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          
          // 人物图标
          ctx.beginPath();
          ctx.arc(40, 28, 12, 0, Math.PI * 2);
          ctx.stroke();
          
          // 身体
          ctx.beginPath();
          ctx.moveTo(18, 65);
          ctx.quadraticCurveTo(18, 45, 40, 45);
          ctx.quadraticCurveTo(62, 45, 62, 65);
          ctx.stroke();
        }
      }
    };

    // 绘制所有图标
    Object.entries(icons).forEach(([name, icon]) => {
      const canvas = document.getElementById(name);
      const ctx = canvas.getContext('2d');
      icon.draw(ctx, '#999999');
    });

    function downloadIcon(name, suffix = '') {
      const canvas = document.getElementById(name);
      const link = document.createElement('a');
      link.download = `${name}${suffix}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function downloadAll() {
      const iconNames = Object.keys(icons);
      
      // 下载普通状态
      iconNames.forEach(name => {
        const canvas = document.getElementById(name);
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, 81, 81);
        icons[name].draw(ctx, '#999999');
      });
      
      setTimeout(() => {
        iconNames.forEach(name => downloadIcon(name));
      }, 100);

      // 下载选中状态
      setTimeout(() => {
        iconNames.forEach(name => {
          const canvas = document.getElementById(name);
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, 81, 81);
          icons[name].draw(ctx, '#000000');
          downloadIcon(name, '-active');
        });
      }, 500);
    }
  </script>
</body>
</html>
